<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Guess My Number!</title>
  </head>
  <body>
    <!-- Background decoration -->
    <div class="stars"></div>
    <div class="floor"></div>

    <header>
      <h1>Guess My Number!</h1>

      <!-- Player names -->
      <div class="players">
        <p class="player1 active">Player 1</p>
        <p class="player2">Player 2</p>
      </div>

      <p class="between">(Between 1 and 20)</p>
      <button class="btn again">Play Again</button>
      <div class="number">?</div>
    </header>
    <main>
      <section class="left">
        <input type="number" min="1" max="20" class="guess" placeholder="00" />
        <button class="btn check">Check!</button>
      </section>
      <section class="right">
        <p class="message">Start guessing...</p>
        <p class="label-score1">💯 Player1 Score: <span class="score1">20</span></p>
        <p class="label-score2">💯 Player2 Score: <span class="score2">20</span></p>
        <p class="label-highscore">
          🥇 Highscore: <span class="highscore">0</span>
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
